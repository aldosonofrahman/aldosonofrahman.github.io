<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>INCHIFAU - 4 Opciones</title>
<style>
body{margin:0;font-family:Arial;background:#f0f6ff}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;padding:20px;max-width:1200px;margin:auto}

</style>
</head>
<body>
<header><img src="logo.jpg"><h1>INSTITUTO NACIONAL DE CHINAMECA<br>ING FELIX ANTONIO ULLOA</h1><h2 style="color:white">¡4 OPCIONES PARA TU FUTURO!</h2></header>
<div class="grid">
<div class="card"><img src="general.jpg"></div>
<div class="card"><img src="salud.jpg"></div>
<div class="card"><img src="software.jpg"></div>
<div class="card"><img src="gestion.jpg"></div>
</div>
<footer>INCHIFAU 2026 - Chinameca</footer>
</body>
</html>
